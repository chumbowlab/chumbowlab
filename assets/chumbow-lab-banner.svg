      <stop offset="0" stop-color="#0b100d"/>
      <stop offset="0.55" stop-color="#12251a"/>
      <stop offset="1" stop-color="#09100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="75%">
      <stop offset="0" stop-color="#7bdc45" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7bdc45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a6f36a" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
