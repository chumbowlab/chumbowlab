<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chumbow Lab — Turning Ideas Into Systems That Work</title>
  <desc id="desc">A dark charcoal and deep green banner with lime accents, a geometric C mark, and the Chumbow Lab name.</desc>
  <defs>
