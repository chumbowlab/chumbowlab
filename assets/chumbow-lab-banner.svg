    <path d="M103 43c-12-10-25-15-41-15-35 0-59 25-59 61s24 61 59 61c17 0 31-6 43-18l-17-19c-7 7-15 11-25 11-20 0-33-14-33-35s13-35 33-35c10 0 18 3 25 10z" fill="#102016" transform="translate(28 18) scale(.9)"/>
