<style>

kground:linear-gradient(145deg,#162119,#111813);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:29px;height:29px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--green);background:#1b2b1e}.stat-value{font-size:30px;font-weight:800;letter-spacing:-.055em;margin:12px 0 1px}.stat-note{font-size:11px;color:var(--soft)}.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:15px}.stack{display:grid;gap:15px}.panel{background:linear-gradient(145deg,#141d17,#101711);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h2,.panel-head h3{margin:0;font-size:15px;letter-spacing:-.015em}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.text-link{border:0;background:none;color:var(--green);font-size:11px;font-weight:750;padding:5px}.focus-box{border:1px solid #365337;background:linear-gradient(110deg,#1c3320,#18271c);border-radius:14px;padding:15px}.focus-box label{display:block;color:#c4e8b6;font-size:11px;font-weight:750;margin-bottom:7px}.focus-box textarea{width:100%;background:#0d160f;border:1px solid #35543a;color:var(--text);padding:10px;border-radius:10px;resize:vertical;min-height:60px}.focus-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}.focus-row span{font-size:10px;color:#9db29e}.list{display:grid;gap:8px}.item{border:1px solid #29382d;background:#141e17;border-radius:13px;padding:12px;display:flex;gap:12px;align-items:flex-start}.item:hover{border-color:#466748}.item-main{min-width:0;flex:1}.item-title{font-size:12px;font-weight:750;margin:0;color:#eff6ef}.item-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:5px}.item-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:5px;flex:0 0 auto}.dot.high{background:var(--red)}.dot.medium{background:var(--amber)}.dot.low{background:var(--blue)}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:800;background:#202c23;color:#c4d1c5;border:1px solid #334235}.tag.open{color:#b5dca2}.tag.done{color:#9ba99d}.tag.overdue{color:#ffaaaa;background:#2a1717;border-color:#633c3c}.tag.meeting{color:#9ad4ff}.tag.due{color:#ffdb91;background:#2b2112;border-color:#5d4724}.empty{border:1px dashed #344437;color:var(--muted);border-radius:12px;padding:20px;text-align:center;font-size:12px}.brief-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #27342b}.brief-row:last-child{border:0;padding-bottom:0}.brief-time{width:59px;flex:0 0 auto;color:var(--green);font-weight:800;font-size:10px}.brief-content{min-width:0}.brief-content strong{display:block;font-size:11px}.brief-content span{font-size:10px;color:var(--muted)}.quick-form{display:flex;gap:8px}.quick-form input{flex:1;min-width:0}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:11px;font-weight:700}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;min-width:0;background:#0b120d;border:1px solid #304034;color:var(--text);padding:10px 11px;border-radius:10px}.field textarea{min-height:82px;resize:vertical}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input{flex:1;min-width:180px}.filters select{width:auto;min-width:145px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #26342a;font-size:11px}.table th{color:var(--soft);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:#151f18}.table tr:last-child td{border-bottom:0}.table td{color:#cbd7cc}.table td strong{color:var(--text)}.action-btn{border:0;background:transparent;color:var(--green);padding:4px 6px;font-size:11px;font-weight:700}.action-btn:hover{text-decoration:underline}.calendar-card{display:flex;gap:13px;padding:13px;border:1px solid var(--line);background:#141e17;border-radius:13px}.date-tile{width:48px;flex:0 0 48px;border:1px solid #3a553d;background:#1b2c1e;border-radius:11px;text-align:center;padding:7px 3px}.date-tile b{display:block;font-size:18px;line-height:1.2;color:var(--green)}.date-tile span{font-size:9px;color:#b8c9b8;text-transform:uppercase}.calendar-info{flex:1;min-width:0}.calendar-info strong{font-size:12px}.calendar-info p{margin:4px 0 0;color:var(--muted);font-size:10px}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.review-grid .field textarea{min-height:130px}.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.guide-card{background:#141e17;border:1px solid var(--line);border-radius:14px;padding:15px}.guide-card .guide-icon{font-size:20px;margin-bottom:7px}.guide-card h3{font-size:13px;margin:0 0 5px}.guide-card p{color:var(--muted);font-size:11px;margin:0}.steps{display:grid;gap:10px;counter-reset:step}.step{display:flex;gap:11px;align-items:flex-start}.step:before{counter-increment:step;content:counter(step);width:24px;height:24px;border-radius:8px;background:#223a25;color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:850;flex:0 0 auto}.notice{border:1px solid #69552c;background:#241e12;border-radius:12px;padding:12px;color:#f0dba9;font-size:11px}.footer-note{color:var(--soft);font-size:10px;margin-top:16px;text-align:center}.overlay{position:fixed;inset:0;background:#020503bb;backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(660px,100%);max-height:90vh;overflow:auto;background:#121b15;border:1px solid #405342;border-radius:19px;padding:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{font-size:17px;margin:0}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.close{background:transparent;border:0;color:var(--muted);font-size:22px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green);color:#112013;border-radius:11px;padding:10px 15px;font-size:12px;font-weight:800;box-shadow:var(--shadow);z-index:40}.hidden{display:none!important}.mobile-scrim{display:none}
@media(max-width:1020px){.app{grid-template-columns:220px minmax(0,1fr)}.grid-main{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.guide-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;left:-270px;top:0;width:250px;z-index:30;transition:left .22s;height:100vh}.sidebar.open{left:0}.mobile-scrim.show{display:block;position:fixed;inset:0;background:#0009;z-index:25}.menu-toggle{display:inline-flex}.topbar{padding:12px 15px}.top-actions .btn.ghost{display:none}.content{padding:21px 15px 35px}.page-head{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:25px}.review-grid,.guide-grid{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media(max-width:420px){.topbar{gap:7px}.top-actions{gap:5px}.top-actions .btn{padding:8px 9px;font-size:11px}.crumb{font-size:10px}.stats{grid-template-columns:1fr 1fr}.stat-top{font-size:10px}.stat-icon{width:25px;height:25px}.focus-row{align-items:flex-start;flex-direction:column}}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="../../assets/chumbow-lab-logo.svg" alt="Chumbow Lab logo"><div><strong>CHUMBOW LAB</strong><span>Founder Operations Hub</span></div></div>
    <div><p class="workspace-label">Workspace</p><nav class="nav" id="nav">
      <button class="active" data-view="overview"><span class="ico">⌂</span>Overview</button>
      <button data-view="tasks"><span class="ico">✓</span>Tasks & actions</button>
      <button data-view="meetings"><span class="ico">▦</span>Meetings & calendar</button>
      <button data-view="followups"><span class="ico">↗</span>Follow-ups</button>
      <button data-view="review"><span class="ico">◷</span>Weekly review</button>
      <button data-view="guide"><span class="ico">⌘</span>Start here</button>
    </nav></div>
    <div class="sidebar-foot"><strong>Keep the work visible.</strong><p>A practical workspace for priorities, conversations and next actions.</p><div class="tiny-row"><span>CHUMBOW LAB</span><span>V1.0 PROTOTYPE</span></div></div>
  </aside>
  <div class="mobile-scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="btn menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button><div class="crumb">Workspace <span style="color:#506052">/</span> <b id="crumbName">Overview</b></div></div>
      <div class="top-actions"><button class="btn ghost" id="backupBtn">↓ Backup</button><button class="btn" id="quickCaptureBtn">＋ Quick capture</button><button class="btn primary" id="primaryAdd">＋ Add task</button></div>
    </header>
    <div class="content" id="content" aria-live="polite"></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json" class="hidden">
<script>
(()=>{
'use strict';
const KEY='chumbow-founder-operations-hub-v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dateISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const shiftDate=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dateISO(d)};
const mondayOf=(iso=dateISO())=>{const d=new Date(iso+'T12:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dateISO(d)};
const fmtDate=(iso,opts={month:'short',day:'numeric'})=>iso?new Date(iso+'T12:00:00').toLocaleDateString(undefined,opts):'No date';
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sampleData=()=>({
  demo:true,focus:'Protect the morning for priority work. Close important follow-ups before the week gets busy.',
  tasks:[
    {id:uid(),title:'Review the top three priorities for the week',project:'Founder Operations',owner:'Paul',due:shiftDate(0),priority:'High',status:'In progress',notes:'Confirm the outcomes that matter most.'},
    {id:uid(),title:'Prepare notes for the website review',project:'Website',owner:'Paul',due:shiftDate(0),priority:'Medium',status:'Not started',notes:'Gather open questions and decisions.'},
    {id:uid(),title:'Organise outstanding action items',project:'Operations',owner:'Paul',due:shiftDate(1),priority:'Medium',status:'Not started',notes:'Make ownership and next steps clear.'},
    {id:uid(),title:'Review the monthly expense summary',project:'Administration',owner:'Paul',due:shiftDate(3),priority:'Low',status:'Not started',notes:'Check the records before sharing.'},
    {id:uid(),title:'Send meeting outcomes to attendees',project:'Operations',owner:'Paul',due:shiftDate(-1),priority:'High',status:'Not started',notes:'Example overdue action for the demo.'}
  ],
  meetings:[
    {id:uid(),title:'Weekly planning session',date:shiftDate(0),start:'10:00',end:'10:30',attendees:'Founder / Operations',location:'Google Meet',agenda:'Review priorities; surface blockers; agree next actions.',notes:''},
    {id:uid(),title:'Website progress review',date:shiftDate(1),start:'14:00',end:'14:45',attendees:'Project team',location:'Online',agenda:'Review open items, content and delivery sequence.',notes:''},
    {id:uid(),title:'Weekly wrap-up',date:shiftDate(4),start:'15:30',end:'16:00',attendees:'Founder / Operations',location:'Online',agenda:'Capture decisions and prepare next week.',notes:''}
  ],
  followups:[
    {id:uid(),person:'Website project contact',context:'Confirm the next content review milestone',channel:'Email',nextDate:shiftDate(0),status:'Due',notes:'Demonstration record — replace with a real contact only in a private workspace.'},
    {id:uid(),person:'Operations stakeholder',context:'Share the updated action tracker',channel:'Message',nextDate:shiftDate(1),status:'Planned',notes:'Agree who owns the next step.'},
    {id:uid(),person:'Service provider',context:'Confirm availability and estimate',channel:'Call',nextDate:shiftDate(-1),status:'Due',notes:'Demo record.'}
  ],
  review:{weekOf:mondayOf(),wins:'',blockers:'',lessons:'',next:'',savedAt:''}
});
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}
if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.meetings)||!Array.isArray(data.followups))data=sampleData();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Could not save. Browser storage may be full.');return false}}
let view='overview',searchTerm='',taskStatus='All',taskPriority='All',toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function badge(text,cls=''){return `<span class="tag ${cls}">${esc(text)}</span>`}
function isOverdue(item){return item.due&&item.due<dateISO()&&item.status!=='Completed'}
function taskItem(t){return `<div class="item"><span class="dot ${t.priority.toLowerCase()}"></span><div class="item-main"><p class="item-title">${esc(t.title)}</p><div class="item-meta"><span>${esc(t.project||'General')}</span><span>·</span><span>${esc(t.owner||'Unassigned')}</span><span>·</span><span>${fmtDate(t.due)}</span>${badge(t.priority,t.priority.toLowerCase())}${badge(t.status,t.status==='Completed'?'done':'open')}${isOverdue(t)?badge('Overdue','overdue'):''}</div></div><div class="item-actions"><button class="action-btn" data-action="edit-task" data-id="${t.id}">Edit</button>${t.status!=='Completed'?`<button class="action-btn" data-action="complete-task" data-id="${t.id}">Done</button>`:''}</div></div>`}
function meetingItem(m){return `<div class="calendar-card"><div class="date-tile"><b>${new Date(m.date+'T12:00:00').getDate()}</b><span>${new Date(m.date+'T12:00:00').toLocaleDateString(undefined,{month:'short'})}</span></div><div class="calendar-info"><strong>${esc(m.title)}</strong><p>${esc(m.start)}–${esc(m.end)} · ${esc(m.location||'Location not set')}</p><p>${esc(m.attendees||'Attendees not set')}</p><div class="item-actions" style="margin-top:7px"><button class="action-btn" data-action="edit-meeting" data-id="${m.id}">Edit</button><button class="action-btn" data-action="delete-meeting" data-id="${m.id}">Remove</button></div></div></div>`}
function followItem(f){return `<div class="item"><span class="dot ${f.status==='Done'?'low':f.status==='Due'?'medium':''}"></span><div class="item-main"><p class="item-title">${esc(f.person)} <span style="font-weight:450;color:var(--muted)">— ${esc(f.context)}</span></p><div class="item-meta"><span>${esc(f.channel)}</span><span>·</span><span>${fmtDate(f.nextDate)}</span>${badge(f.status,f.status==='Done'?'done':f.status==='Due'?'due':'open')}</div></div><div class="item-actions"><button class="action-btn" data-action="edit-follow" data-id="${f.id}">Edit</button>${f.status!=='Done'?`<button class="action-btn" data-action="complete-follow" data-id="${f.id}">Done</button>`:''}</div></div>`}
function sortedTasks(){return [...data.tasks].sort((a,b)=>{const aDone=a.status==='Completed',bDone=b.status==='Completed';if(aDone!==bDone)return aDone?1:-1;const p={High:0,Medium:1,Low:2};return (p[a.priority]??3)-(p[b.priority]??3)||(a.due||'9999').localeCompare(b.due||'9999')})}
function render(){const names={overview:'Overview',tasks:'Tasks & actions',meetings:'Meetings & calendar',followups:'Follow-ups',review:'Weekly review',guide:'Start here'};$('#crumbName').textContent=names[view];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#primaryAdd').textContent=view==='meetings'?'＋ Add meeting':view==='followups'?'＋ Add follow-up':'＋ Add task';$('#primaryAdd').dataset.add=view==='meetings'?'meeting':view==='followups'?'follow':'task';$('#content').innerHTML=({overview:renderOverview,tasks:renderTasks,meetings:renderMeetings,followups:renderFollowups,review:renderReview,guide:renderGuide})[view]();}
function pageHead(kicker,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></div>`}
function renderOverview(){const today=dateISO(),open=data.tasks.filter(t=>t.status!=='Completed').length,due=data.tasks.filter(t=>t.due===today&&t.status!=='Completed').length,over=data.tasks.filter(isOverdue).length,mt=data.meetings.filter(m=>m.date===today).length,fu=data.followups.filter(f=>f.nextDate<=today&&f.status!=='Done').length;const nextMeet=[...data.meetings].filter(m=>m.date>=today).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);const todo=sortedTasks().filter(t=>t.status!=='Completed').slice(0,4);const dueF=[...data.followups].filter(f=>f.status!=='Done').sort((a,b)=>a.nextDate.localeCompare(b.nextDate)).slice(0,3);const d=new Date();const hello=d.getHours()<12?'Good morning':d.getHours()<17?'Good afternoon':'Good evening';return `${pageHead('FOUNDER WORKSPACE',`${hello}, Paul.`,`Your work at a glance · ${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}`,`${data.demo?'<span class="pill demo">● Sample workspace</span>':'<span class="pill">● Personal workspace</span>'}`)}
<div class="stats"><div class="stat"><div class="stat-top"><span>Open tasks</span><span class="stat-icon">✓</span></div><div class="stat-value">${open}</div><div class="stat-note">${due} due today</div></div><div class="stat"><div class="stat-top"><span>Meetings today</span><span class="stat-icon">▦</span></div><div class="stat-value">${mt}</div><div class="stat-note">${nextMeet.length} upcoming in your schedule</div></div><div class="stat"><div class="stat-top"><span>Follow-ups due</span><span class="stat-icon">↗</span></div><div class="stat-value">${fu}</div><div class="stat-note">People and conversations to revisit</div></div><div class="stat"><div class="stat-top"><span>Overdue actions</span><span class="stat-icon">!</span></div><div class="stat-value">${over}</div><div class="stat-note">Review and reschedule where needed</div></div></div>
<div class="grid-main"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>Today's focus</h2><p>Keep the most important outcome visible.</p></div><span class="pill">DAILY BRIEF</span></div><div class="focus-box"><label for="focusInput">ONE THING TO PROTECT TIME FOR</label><textarea id="focusInput" rows="2" placeholder="What deserves your attention today?">${esc(data.focus||'')}</textarea><div class="focus-row"><span>Saved in this browser only</span><button class="btn small primary" id="saveFocus">Save focus</button></div></div></section>
<section class="panel"><div class="panel-head"><div><h2>Priority actions</h2><p>Next steps that need attention.</p></div><button class="text-link" data-view="tasks">View all →</button></div><div class="list">${todo.length?todo.map(taskItem).join(''):'<div class="empty">No open tasks. Add a task when something needs tracking.</div>'}</div></section>
<section class="panel"><div class="panel-head"><div><h2>Follow-up queue</h2><p>Keep conversations from going quiet.</p></div><button class="text-link" data-view="followups">Open follow-ups →</button></div><div class="list">${dueF.length?dueF.map(followItem).join(''):'<div class="empty">Your follow-up queue is clear.</div>'}</div></section></div>
<div class="stack"><section class="panel"><div class="panel-head"><div><h2>Coming up</h2><p>Meetings on your calendar.</p></div><button class="text-link" data-view="meetings">Calendar →</button></div><div class="list">${nextMeet.length?nextMeet.map(meetingItem).join(''):'<div class="empty">No upcoming meetings. Add a meeting to create a plan.</div>'}</div></section>
<section class="panel"><div class="panel-head"><div><h2>Quick capture</h2><p>Get a thought out of your head.</p></div><span class="pill">FAST ENTRY</span></div><form class="quick-form" id="quickForm"><input name="title" required placeholder="Add a task or next action…" aria-label="Quick task"><button class="btn primary">Add</button></form><p class="item-meta" style="margin-top:9px">Quick captures are added as medium-priority tasks due today.</p></section>
<section class="panel"><div class="panel-head"><div><h2>Weekly rhythm</h2><p>Close loops before opening new ones.</p></div></div><div class="brief-row"><div class="brief-time">MON–FRI</div><div class="brief-content"><strong>Plan → Execute → Review</strong><span>Keep tasks, meetings and follow-ups connected.</span></div></div><div class="brief-row"><div class="brief-time">FRIDAY</div><div class="brief-content"><strong>Capture decisions and open loops</strong><span>Record wins, blockers and next week's priorities.</span></div></div><button class="btn small" style="margin-top:12px" data-view="review">Open weekly review →</button></section></div></div><div class="footer-note">Founder Operations Hub · Local prototype · Your records stay in this browser until you export them.</div>`}
function renderTasks(){let rows=sortedTasks().filter(t=>(taskStatus==='All'||t.status===taskStatus)&&(taskPriority==='All'||t.priority===taskPriority)&&(`${t.title} ${t.project} ${t.owner}`.toLowerCase().includes(searchTerm)));return `${pageHead('EXECUTION', 'Tasks & actions', 'Turn commitments into clear owners, dates and next steps.', '<button class="btn primary" data-add="task">＋ Add task</button>')}<section class="panel"><div class="filters"><input id="taskSearch" placeholder="Search tasks, projects or owners…" value="${esc(searchTerm)}"><select id="taskStatus"><option ${taskStatus==='All'?'selected':''}>All</option><option ${taskStatus==='Not started'?'selected':''}>Not started</option><option ${taskStatus==='In progress'?'selected':''}>In progress</option><option ${taskStatus==='Waiting'?'selected':''}>Waiting</option><option ${taskStatus==='Completed'?'selected':''}>Completed</option></select><select id="taskPriority"><option ${taskPriority==='All'?'selected':''}>All</option><option ${taskPriority==='High'?'selected':''}>High</option><option ${taskPriority==='Medium'?'selected':''}>Medium</option><option ${taskPriority==='Low'?'selected':''}>Low</option></select><button class="btn small" id="exportTasks">↓ Export CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Action</th><th>Project / owner</th><th>Due</th><th>Priority</th><th>Status</th><th>Manage</th></tr></thead><tbody>${rows.length?rows.map(t=>`<tr><td><strong>${esc(t.title)}</strong><div class="item-meta">${esc(t.notes||'')}</div></td><td>${esc(t.project||'General')}<br><span style="color:var(--soft)">${esc(t.owner||'Unassigned')}</span></td><td>${fmtDate(t.due)} ${isOverdue(t)?badge('Overdue','overdue'):''}</td><td>${badge(t.priority,t.priority.toLowerCase())}</td><td>${badge(t.status,t.status==='Completed'?'done':'open')}</td><td><button class="action-btn" data-action="edit-task" data-id="${t.id}">Edit</button>${t.status!=='Completed'?`<button class="action-btn" data-action="complete-task" data-id="${t.id}">Done</button>`:`<button class="action-btn" data-action="reopen-task" data-id="${t.id}">Reopen</button>`}<button class="action-btn" data-action="delete-task" data-id="${t.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">No tasks match these filters.</div></td></tr>`}</tbody></table></div><div class="footer-note">${rows.length} task(s) shown · Use status and due dates to keep the action list current.</div></section>`}
function renderMeetings(){const rows=[...data.meetings].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));return `${pageHead('TIME & ALIGNMENT','Meetings & calendar','Prepare conversations, capture decisions and export events to your calendar.','<button class="btn" id="exportIcs">↓ Export .ics</button><button class="btn primary" data-add="meeting">＋ Add meeting</button>')}<div class="grid-main"><section class="panel"><div class="panel-head"><div><h2>Scheduled meetings</h2><p>${rows.length} meeting(s) recorded.</p></div><span class="pill meeting">CALENDAR</span></div><div class="list">${rows.length?rows.map(meetingItem).join(''):'<div class="empty">No meetings yet. Add a meeting and capture its agenda.</div>'}</div></section><section class="stack"><div class="panel"><h2 style="font-size:15px;margin:0 0 8px">Calendar hand-off</h2><p class="item-meta">Export meetings as an .ics calendar file, then import it into Google Calendar or another calendar app.</p><button class="btn primary" style="margin-top:12px" id="exportIcs2">Export calendar file</button></div><div class="notice">Live Google Calendar synchronisation is not connected in this prototype. The .ics export is a one-way hand-off; editing an exported event in Google Calendar will not update this workspace.</div></section></div>`}
function renderFollowups(){const rows=[...data.followups].sort((a,b)=>(a.status==='Done')-(b.status==='Done')||a.nextDate.localeCompare(b.nextDate));return `${pageHead('RELATIONSHIPS','Follow-ups','Track important conversations, commitments and the next touchpoint.','<button class="btn primary" data-add="follow">＋ Add follow-up</button>')}<section class="panel"><div class="panel-head"><div><h2>Follow-up tracker</h2><p>Keep the reason, channel and next date visible.</p></div><span class="pill">RELATIONSHIP CARE</span></div><div class="list">${rows.length?rows.map(followItem).join(''):'<div class="empty">No follow-ups recorded.</div>'}</div></section>`}
function renderReview(){const r=data.review||{};return `${pageHead('REFLECTION & PLANNING','Weekly review','Close open loops, record what moved forward and plan the next week.','<span class="pill">WEEK OF ${fmtDate(r.weekOf||mondayOf())}</span>')}<section class="panel"><form id="reviewForm"><div class="review-grid"><div class="field"><label for="wins">What moved forward?</label><textarea id="wins" name="wins" placeholder="Wins, progress, decisions and completed work…">${esc(r.wins||'')}</textarea></div><div class="field"><label for="blockers">What is blocked or unresolved?</label><textarea id="blockers" name="blockers" placeholder="Open loops, delays, dependencies and risks…">${esc(r.blockers||'')}</textarea></div><div class="field"><label for="lessons">What did I learn?</label><textarea id="lessons" name="lessons" placeholder="What should be repeated, changed or simplified?">${esc(r.lessons||'')}</textarea></div><div class="field"><label for="next">What are next week's top priorities?</label><textarea id="next" name="next" placeholder="List the three outcomes that matter most…">${esc(r.next||'')}</textarea></div></div><div class="modal-actions"><span class="item-meta" style="margin-right:auto">${r.savedAt?'Last saved '+esc(new Date(r.savedAt).toLocaleString()):'Not saved yet'}</span><button class="btn primary">Save weekly review</button></div></form></section>`}
function renderGuide(){return `${pageHead('WORKSPACE GUIDE','Start here','A simple operating rhythm for keeping founder work organised.')}<div class="guide-grid"><div class="guide-card"><div class="guide-icon">◎</div><h3>1. Capture</h3><p>Put new commitments into Tasks & actions or use Quick capture when you need to record something quickly.</p></div><div class="guide-card"><div class="guide-icon">▦</div><h3>2. Prepare</h3><p>Add meetings with an agenda, attendees and a clear purpose. Export the calendar file when you need it in Google Calendar.</p></div><div class="guide-card"><div class="guide-icon">↗</div><h3>3. Follow through</h3><p>Track important people, conversations and promised next steps in Follow-ups.</p></div><div class="guide-card"><div class="guide-icon">◷</div><h3>4. Review</h3><p>Use the weekly review to record progress, blockers, lessons and the next set of priorities.</p></div><div class="guide-card"><div class="guide-icon">⬇</div><h3>5. Back up</h3><p>Export a JSON backup regularly. Keep the backup somewhere private and secure.</p></div><div class="guide-card"><div class="guide-icon">⚙</div><h3>6. Keep it safe</h3><p>Use only non-sensitive information in this prototype. It has no account login or shared team database.</p></div></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h2>Workspace data</h2><p>Export a backup or restore a backup in this browser.</p></div><span class="pill">LOCAL STORAGE</span></div><div class="head-actions"><button class="btn" id="backupBtn2">↓ Download JSON backup</button><button class="btn" id="importBtn">↑ Import JSON backup</button><button class="btn danger" id="resetDemo">Restore demo data</button></div><p class="item-meta" style="margin-top:12px">Import replaces the current workspace data. Export before importing if you may need to restore your current records.</p></section><div class="notice" style="margin-top:15px"><strong>Prototype limitation:</strong> records are stored in this browser using localStorage. They are not encrypted, synchronised with Google Sheets, shared across devices or backed up automatically. Do not store passwords, personal identity details, sensitive client information, private meeting notes or financial credentials here.</div>`}
function openModal(type,item=null){const edit=!!item, titles={task:edit?'Edit task':'Add a task',meeting:edit?'Edit meeting':'Add a meeting',follow:edit?'Edit follow-up':'Add a follow-up',quick:'Quick capture'};let fields='';if(type==='task'||type==='quick'){fields=`<div class="field span2"><label>Action title *</label><input name="title" required value="${esc(item?.title||'')}" placeholder="What needs to happen?"></div>${type==='task'?`<div class="field"><label>Project / area</label><input name="project" value="${esc(item?.project||'General')}" placeholder="e.g. Operations"></div><div class="field"><label>Owner</label><input name="owner" value="${esc(item?.owner||'Paul')}" placeholder="Who owns this?"></div><div class="field"><label>Due date</label><input type="date" name="due" value="${esc(item?.due||dateISO())}"></div><div class="field"><label>Priority</label><select name="priority">${['High','Medium','Low'].map(x=>`<option ${item?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Not started','In progress','Waiting','Completed'].map(x=>`<option ${item?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Notes</label><textarea name="notes" placeholder="Context or next step">${esc(item?.notes||'')}</textarea></div>`:''}`}
if(type==='meeting'){fields=`<div class="field span2"><label>Meeting title *</label><input name="title" required value="${esc(item?.title||'')}" placeholder="Purpose of the meeting"></div><div class="field"><label>Date *</label><input name="date" type="date" required value="${esc(item?.date||dateISO())}"></div><div class="field"><label>Location / link</label><input name="location" value="${esc(item?.location||'Online')}"></div><div class="field"><label>Start time *</label><input name="start" type="time" required value="${esc(item?.start||'10:00')}"></div><div class="field"><label>End time *</label><input name="end" type="time" required value="${esc(item?.end||'10:30')}"></div><div class="field span2"><label>Attendees</label><input name="attendees" value="${esc(item?.attendees||'')}" placeholder="Names or roles"></div><div class="field span2"><label>Agenda</label><textarea name="agenda" placeholder="Topics and desired outcome">${esc(item?.agenda||'')}</textarea></div><div class="field span2"><label>Notes / decisions</label><textarea name="notes" placeholder="Record decisions after the meeting">${esc(item?.notes||'')}</textarea></div>`}
if(type==='follow'){fields=`<div class="field"><label>Person / organisation *</label><input name="person" required value="${esc(item?.person||'')}" placeholder="Who needs a follow-up?"></div><div class="field"><label>Channel</label><select name="channel">${['Email','Call','Message','Meeting','Other'].map(x=>`<option ${item?.channel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Context / commitment *</label><input name="context" required value="${esc(item?.context||'')}" placeholder="What needs to be followed up?"></div><div class="field"><label>Next follow-up date</label><input name="nextDate" type="date" value="${esc(item?.nextDate||dateISO())}"></div><div class="field"><label>Status</label><select name="status">${['Planned','Due','Waiting','Done'].map(x=>`<option ${item?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field span2"><label>Notes</label><textarea name="notes" placeholder="Context or next action">${esc(item?.notes||'')}</textarea></div>`}
$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${titles[type]}</h2><button class="close" type="button" data-action="close-modal" aria-label="Close">×</button></div><form id="recordForm" data-type="${type}" data-id="${esc(item?.id||'')}"><div class="modal-grid">${fields}</div><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${edit?'Save changes':'Save record'}</button></div></form></section></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});const first=$('#recordForm input');if(first)first.focus()}
function closeModal(){$('#modalRoot').innerHTML=''}
function handleSubmit(e){const form=e.target;if(form.id==='recordForm'){e.preventDefault();const type=form.dataset.type,id=form.dataset.id,fd=new FormData(form),v=Object.fromEntries(fd.entries());if(type==='task'||type==='quick'){const t={id:id||uid(),title:v.title.trim(),project:v.project||'Quick capture',owner:v.owner||'Paul',due:v.due||dateISO(),priority:v.priority||'Medium',status:v.status||'Not started',notes:v.notes||''};if(type==='quick'){t.project='Quick capture';t.priority='Medium';t.status='Not started';t.due=dateISO()}if(id)data.tasks=data.tasks.map(x=>x.id===id?t:x);else data.tasks.unshift(t)}else if(type==='meeting'){if(v.end<=v.start){toast('Meeting end time must be later than start time.');return}const m={id:id||uid(),...v};if(id)data.meetings=data.meetings.map(x=>x.id===id?m:x);else data.meetings.push(m)}else if(type==='follow'){const f={id:id||uid(),...v};if(id)data.followups=data.followups.map(x=>x.id===id?f:x);else data.followups.push(f)}data.demo=false;persist();closeModal();render();toast(type==='quick'?'Captured as a task.':'Record saved.')}if(form.id==='quickForm'){e.preventDefault();const title=new FormData(form).get('title').trim();if(!title)return;data.tasks.unshift({id:uid(),title,project:'Quick capture',owner:'Paul',due:dateISO(),priority:'Medium',status:'Not started',notes:''});data.demo=false;persist();form.reset();render();toast('Captured as a task.')}if(form.id==='reviewForm'){e.preventDefault();const fd=new FormData(form);data.review={weekOf:data.review?.weekOf||mondayOf(),wins:fd.get('wins'),blockers:fd.get('blockers'),lessons:fd.get('lessons'),next:fd.get('next'),savedAt:new Date().toISOString()};data.demo=false;persist();render();toast('Weekly review saved.')}}
function handleAction(e){const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;searchTerm='';$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');render();return}const add=e.target.closest('[data-add]');if(add){openModal(add.dataset.add);return}const b=e.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='close-modal'){closeModal();return}if(action==='edit-task'){const t=data.tasks.find(x=>x.id===id);if(t)openModal('task',t)}if(action==='complete-task'){data.tasks=data.tasks.map(t=>t.id===id?{...t,status:'Completed'}:t);data.demo=false;persist();render();toast('Task marked complete.')}if(action==='reopen-task'){data.tasks=data.tasks.map(t=>t.id===id?{...t,status:'Not started'}:t);persist();render();toast('Task reopened.')}if(action==='delete-task'&&confirm('Delete this task?')){data.tasks=data.tasks.filter(t=>t.id!==id);persist();render();toast('Task deleted.')}if(action==='edit-meeting'){const m=data.meetings.find(x=>x.id===id);if(m)openModal('meeting',m)}if(action==='delete-meeting'&&confirm('Remove this meeting?')){data.meetings=data.meetings.filter(m=>m.id!==id);persist();render();toast('Meeting removed.')}if(action==='edit-follow'){const f=data.followups.find(x=>x.id===id);if(f)openModal('follow',f)}if(action==='complete-follow'){data.followups=data.followups.map(f=>f.id===id?{...f,status:'Done'}:f);data.demo=false;persist();render();toast('Follow-up marked done.')}}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('chumbow-founder-operations-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),version:1,data},null,2),'application/json');toast('Workspace backup downloaded.')}
function exportTasks(){const cols=['title','project','owner','due','priority','status','notes'];const rows=data.tasks.map(t=>cols.map(k=>t[k]??''));const csv=[cols,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('founder-operations-tasks.csv',csv,'text/csv;charset=utf-8')}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportIcs(){const events=[...data.meetings].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Chumbow Lab//Founder Operations Hub//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Founder Operations Hub'];for(const m of events){const dt=d=>d.replace(/-/g,'');const tm=t=>t.replace(':','')+'00';lines.push('BEGIN:VEVENT','UID:'+m.id+'@chumbowlab','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'') ,'DTSTART:'+dt(m.date)+'T'+tm(m.start),'DTEND:'+dt(m.date)+'T'+tm(m.end),'SUMMARY:'+icsEscape(m.title),'LOCATION:'+icsEscape(m.location),'DESCRIPTION:'+icsEscape('Attendees: '+m.attendees+'\\nAgenda: '+m.agenda+'\\nNotes: '+m.notes),'END:VEVENT')}lines.push('END:VCALENDAR');download('chumbow-founder-operations-calendar.ics',lines.join('\r\n'),'text/calendar;charset=utf-8');toast('Calendar file exported. Import it into Google Calendar.')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result),incoming=obj.data||obj;if(!Array.isArray(incoming.tasks)||!Array.isArray(incoming.meetings)||!Array.isArray(incoming.followups))throw new Error('The file does not contain a recognised workspace backup.');if(!confirm('Importing will replace the current workspace data. Continue?'))return;data={demo:false,focus:incoming.focus||'',tasks:incoming.tasks,meetings:incoming.meetings,followups:incoming.followups,review:incoming.review||{weekOf:mondayOf(),wins:'',blockers:'',lessons:'',next:''}};persist();render();toast('Workspace backup imported.')}catch(err){toast(err.message||'Could not read that backup file.')}};r.readAsText(file)}
document.addEventListener('click',e=>{if(e.target.closest('[data-view]')||e.target.closest('[data-action]')||e.target.closest('[data-add]'))handleAction(e);if(e.target.id==='saveFocus'){data.focus=$('#focusInput').value;data.demo=false;persist();toast('Daily focus saved.')}if(e.target.id==='exportTasks')exportTasks();if(e.target.id==='exportIcs'||e.target.id==='exportIcs2')exportIcs();if(e.target.id==='backupBtn'||e.target.id==='backupBtn2')backup();if(e.target.id==='importBtn')$('#importFile').click();if(e.target.id==='resetDemo'&&confirm('Restore the sample workspace? This replaces current records. Export a backup first if needed.')){data=sampleData();persist();view='overview';render();toast('Sample workspace restored.')}});
document.addEventListener('submit',handleSubmit);
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){searchTerm=e.target.value.toLowerCase();const pos=e.target.selectionStart;render();const field=$('#taskSearch');field.focus();field.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='taskStatus'){taskStatus=e.target.value;render()}if(e.target.id==='taskPriority'){taskPriority=e.target.value;render()}});
$('#primaryAdd').addEventListener('click',()=>openModal($('#primaryAdd').dataset.add||'task'));
$('#quickCaptureBtn').addEventListener('click',()=>openModal('quick'));
$('#backupBtn').addEventListener('click',backup);
$('#importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''});
$('#menuToggle').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show')});$('#scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show')});
render();
})();
</script>
</body>
</html>
